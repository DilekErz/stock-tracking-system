<section class="profile-page">
  <div class="profile-container">

    <div class="profile-header">
      <button class="profile-back-btn" id="backToHomepage">← Back to Dashboard</button>
      <h1>My Profile</h1>
      <p>Manage your stock tracking account and preferences.</p>
    </div>

    <div class="profile-card">
      <div class="profile-avatar" id="profileAvatar">👤</div>

      <div class="profile-info">
        <h2 id="profileFullName">User Name</h2>
        <p>AI Predict User</p>
      </div>

      <div class="profile-details">
        <div class="profile-row">
          <span>Username</span>
          <strong id="profileUsername">-</strong>
          </div>
        

        <div class="profile-row">
          <span>Email</span>
          <strong id="profileEmail">-</strong>
        </div>

        <div class="profile-row">
          <span>Selected Market</span>
          <strong>BIST100</strong>
        </div>

        <div class="profile-row">
          <span>Preferred Currency</span>
          <strong>USD</strong>
        </div>
      </div>

<div class="profile-edit">
    <input type="text" id="newUsername" placeholder="New username">

    <input type="file" id="profileImageInput" accept="image/*">

    <button id="saveProfileBtn">Save Profile</button>
  </div>
</div>

   

    <div class="profile-grid">
      <div class="profile-stat">
        <h3>Watchlist</h3>
        <p>5 Assets</p>
      </div>

      <div class="profile-stat">
        <h3>Prediction Mode</h3>
        <p>AI Enabled</p>
      </div>

      <div class="profile-stat">
  <h3>Theme</h3>
  <p id="themeStatus">Dark Mode</p>
</div>
    </div>

  </div>
</section>
