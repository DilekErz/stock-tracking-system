<section class="forgot-page" id="forgotPage">
  <div class="forgot-card">

    <div class="forgot-header">
      <h1>Forgot Password</h1>
      <p id="forgotDescription">
        Enter your account email to continue.
      </p>
    </div>

    <form class="forgot-email-form" id="forgotEmailForm">
      <div class="input-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your account email" required />
      </div>

      <button type="submit" class="forgot-btn">
        Continue
      </button>

      <button type="button" class="back-login-btn" id="backToLoginFromForgot">
        Back To Login
      </button>
    </form>

    <form class="forgot-reset-form" id="forgotResetForm" style="display: none;">
      <div class="input-group">
        <label>New Password</label>
        <input type="password" name="newPassword" placeholder="Create a new password" required />
      </div>

      <div class="input-group">
        <label>Confirm New Password</label>
        <input type="password" name="confirmPassword" placeholder="Confirm new password" required />
      </div>

      <button type="submit" class="forgot-btn">
        Update Password
      </button>
    </form>

  </div>
</section>
